{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>👤 My Profile</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ current_user.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ current_user.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        New Password
                        <small class="text-muted">
                            (Leave blank to keep current password)
                        </small>

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter new password">

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Update Profile

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
