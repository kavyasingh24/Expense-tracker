{% extends "base.html" %}

{% block title %}
Categories
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>📂 Manage Categories</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Category Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Example: Food"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    ➕ Add Category

                </button>

            </form>

            <hr>

            <h5>Your Categories</h5>

            {% if categories %}

                <ul class="list-group">

                    {% for category in categories %}

                    <li class="list-group-item">

                        {{ category.name }}

                    </li>

                    {% endfor %}

                </ul>

            {% else %}

                <p class="text-muted">

                    No categories added yet.

                </p>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
