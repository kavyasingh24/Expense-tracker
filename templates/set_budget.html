{% extends "base.html" %}

{% block title %}
Set Budget
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h3>💰 Set Monthly Budget</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Monthly Budget (₹)
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="monthly_budget"
                                class="form-control"
                                placeholder="Enter your monthly budget"
                                value="{{ budget.monthly_budget if budget else '' }}"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Save Budget

                        </button>

                    </form>

                    <hr>

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="btn btn-secondary w-100">

                        Back to Dashboard

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
