<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Edit Expense</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Title</label>

            <input
                type="text"
                name="title"
                class="form-control"
                value="{{ expense.title }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Amount</label>

            <input
                type="number"
                step="0.01"
                name="amount"
                class="form-control"
                value="{{ expense.amount }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>

            <input
                type="text"
                name="category"
                class="form-control"
                value="{{ expense.category }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Expense Date</label>

            <input
                type="date"
                name="expense_date"
                class="form-control"
                value="{{ expense.expense_date }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="4">{{ expense.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Update Expense
        </button>

        <a href="{{ url_for('expenses') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
