{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow mt-5">

            <div class="card-header bg-primary text-white text-center">

                <h3>Login</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Login

                        </button>

                    </div>

                </form>

                <hr>

                <p class="text-center">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">

                        Register Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
